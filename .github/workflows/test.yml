name: tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 引擎 + 决策层 + 记忆库测试
        run: |
          python tests/test_engine.py
          python -m pytest tests/ -q
          python -m pytest memory/tests/ -q
      - name: 验收向量卷一致性（重新生成应与仓库内版本逐字节一致）
        run: |
          cp tests/test_vectors.json /tmp/vectors.expected.json
          python tests/make_vectors.py
          cmp tests/test_vectors.json /tmp/vectors.expected.json
      - name: 隐私终检（每次 push 自动验证"没有泄露"）
        run: python verify.py --privacy
